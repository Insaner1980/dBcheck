complexity:
  LongMethod:
    allowedLines: 80
  LongParameterList:
    allowedFunctionParameters: 10
    allowedConstructorParameters: 10
  TooManyFunctions:
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 25

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 120
  WildcardImport:
    active: false
  UnusedPrivateClass:
    active: true
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true

naming:
  FunctionNaming:
    # Compose-funktiot alkavat isolla kirjaimella
    excludes: ['**/ui/**', '**/widget/**']
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'

# Formatointisaannot ajetaan erillisella ktlintCheck-taskilla, jotta KtLint-
# ja Detekt-löydökset saavat omat koneraporttinsa.
ktlint:
  active: false

Compose:
  CompositionLocalAllowlist:
    allowedCompositionLocals: LocalDbCheckColorScheme,LocalDbCheckTypography,LocalDbCheckSpacing
