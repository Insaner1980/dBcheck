name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (Java/Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CODEQL_BUNDLE_SHA256: 1ec99cfa9420f04c2330784b4ddb8363a0dd67c3e4471cd93963c50e6c433717
      CODEQL_BUNDLE_URL: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.1/codeql-bundle-linux64.tar.zst

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Lukittu versioon v7.0.1.
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # Lukittu versioon v6.0.1.
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # Lukittu versioon v4.0.4.
        with:
          packages: platform-tools platforms;android-37.0

      - name: Download verified CodeQL bundle
        id: codeql-bundle
        shell: bash
        run: |
          bundle_path="$RUNNER_TEMP/codeql-bundle-2.27.1-linux64.tar.zst"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 --output "$bundle_path" "$CODEQL_BUNDLE_URL"
          echo "$CODEQL_BUNDLE_SHA256  $bundle_path" | sha256sum --check --strict
          echo "path=$bundle_path" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # Lukittu versioon v4.38.2.
        with:
          languages: java-kotlin
          build-mode: manual
          # CodeQL 2.26.1 ei tue Kotlin 2.4.10:tä. Poista pin, kun vakaa bundle sisältää tuen.
          tools: ${{ steps.codeql-bundle.outputs.path }}

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # Lukittu versioon v4.38.2.
        with:
          category: "/language:java-kotlin"
